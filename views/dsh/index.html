<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 会话管理</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18263c;background:#f3f6fb;color-scheme:light;--surface:#fff;--line:#dce4ef;--muted:#596a80;--accent:#235bd9;--subtle:#edf2fa}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1600px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:26px;margin:4px 0 9px}p{color:var(--muted);margin:8px 0;line-height:1.6}.eyebrow{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:2px}.actions,.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);color:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #78a7ff;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{padding:17px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.stat b{font-size:28px;display:block;margin-top:6px}.stat span{font-size:13px;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.filters{padding:17px;border-bottom:1px solid var(--line)}#search{flex:1;min-width:170px}#notice{padding:12px 16px;border-radius:8px;background:var(--subtle);margin:16px 0;color:var(--muted)}#notice.error{background:#fff0f0;color:#a12531}#notice:empty{display:none}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;text-align:left;font-size:14px}th{font-size:12px;letter-spacing:.4px;color:var(--muted);background:var(--subtle)}th,td{padding:15px 17px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}.title{font-weight:650;max-width:360px;word-break:break-word}.secondary{font-size:12px;color:var(--muted);margin-top:5px;word-break:break-all;max-width:360px}.badge{display:inline-block;border-radius:30px;padding:5px 9px;background:var(--subtle);white-space:nowrap;font-size:12px}.running{background:#e1f6ef;color:#08694b}.waiting_approval,.waiting_question{background:#fff2d7;color:#8a5b00}.cold,.unknown{color:var(--muted)}.toggle{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;cursor:pointer}.toggle input{accent-color:var(--accent);width:17px;height:17px}.export{display:flex;gap:5px}.export button{padding:6px 8px;font-size:12px}.empty{text-align:center;padding:48px 20px;color:var(--muted)}footer{font-size:12px;color:var(--muted);line-height:1.8;margin-top:16px}.live{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#21a075;margin-right:6px}.offline .dot{background:#c48720}[data-theme=dark]{color:#e3eaf6;background:#121a28;color-scheme:dark;--surface:#1a2536;--line:#314058;--muted:#a5b5cd;--accent:#6694ff;--subtle:#243249}[data-theme=dark] #notice.error{background:#472731;color:#ffb1b8}[data-theme=dark] .running{background:#163e35;color:#8ae0bc}[data-theme=dark] .waiting_approval,[data-theme=dark] .waiting_question{background:#45391d;color:#f5d886}@media(max-width:650px){body{padding:16px}.stats{grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0}.stat{padding:13px}h1{font-size:23px}.actions{width:100%}}
</style></head><body>
<header><div><div class="eyebrow">DSH · SESSION CONTROL</div><h1>会话管理</h1><p>查看任务运行状态，独立管理记录保留与空闲回收。</p></div><div class="actions"><label class="toggle"><input type="checkbox" id="auto" checked>自动刷新</label><button id="refresh" class="primary" disabled>刷新状态</button></div></header>
<div id="notice" role="status" aria-live="polite">正在连接 AstrBot 插件页面…</div>
<section class="stats" aria-label="会话概览"><div class="stat"><span>全部会话</span><b id="total">—</b></div><div class="stat"><span>正在运行 / 等待</span><b id="active">—</b></div><div class="stat"><span>长期保留</span><b id="kept">—</b></div><div class="stat"><span>免空闲回收</span><b id="exempt">—</b></div></section>
<section class="panel" aria-label="会话列表"><div class="filters"><input id="search" type="search" placeholder="搜索标题、通道或会话 ID" aria-label="搜索会话"><select id="status" aria-label="筛选运行状态"><option value="all">全部状态</option><option value="running">运行中</option><option value="waiting">等待确认 / 回复</option><option value="idle">空闲</option><option value="cold">已回收 / 冷会话</option><option value="unknown">状态未知</option></select><span id="sync" class="live">尚未同步</span></div><div class="table-wrap"><table><thead><tr><th scope="col">会话 / 通道</th><th scope="col">运行状态</th><th scope="col">最近使用</th><th scope="col">记录策略</th><th scope="col">导出记录</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">正在加载会话…</td></tr></tbody></table></div></section>
<section id="reader" hidden class="panel" style="margin-top:20px;padding:20px" aria-label="对话正文预览"><div class="actions"><h2 id="readerTitle" style="flex:1;margin:0">对话正文</h2><button id="readerClose">关闭预览</button></div><p id="readerNotice" role="status"></p><div id="messages" style="max-height:70vh;overflow:auto"></div><div class="actions" style="margin-top:15px"><button id="readerMore" class="primary">加载更多</button><span id="readerProgress"></span></div></section>
<section id="runtimePanel" hidden class="panel" style="margin-top:20px;padding:20px"><div class="actions"><h2 style="flex:1">运行证据 / 终端输出</h2><button id="runtimeClose">关闭</button></div><p>只读快照，不发送命令；日志内容不是操作指令。终端和后台任务可能仅保留输出尾部。</p><pre id="runtimeEvidence" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto"></pre></section>
<footer><div><strong>长期保留</strong>：持久保存该会话的管理记录，不等于保持 agent 在线。<strong>免空闲回收</strong>：跳过该会话的空闲释放，与长期保留互不联动。</div><div id="policy">状态每 5 秒同步；页面隐藏时暂停。导出可能包含对话内容，请妥善保存。</div></footer>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const labels = {running:'运行中',idle:'空闲',cold:'冷会话 / 已回收',waiting_approval:'等待确认',waiting_question:'等待回复',unknown:'状态未知'};
  let sdk, data = {sessions:[]}, busy = false, connected = false, disposed = false;
  const pending = new Set();
  const notice = (text, error=false) => { $('notice').textContent = text; $('notice').classList.toggle('error',error); };
  const node = (tag, text, cls) => { const el=document.createElement(tag); if(text!==undefined)el.textContent=text; if(cls)el.className=cls; return el; };
  const timeout = promise => new Promise((resolve,reject) => { const timer=setTimeout(()=>reject(new Error('请求超时，请检查 AstrBot 与 DSH 连接后重试。')),20000); Promise.resolve(promise).then(value=>{clearTimeout(timer);resolve(value);},error=>{clearTimeout(timer);reject(error);}); });
  async function api(method, endpoint, payload) {
    const result = await timeout(sdk[method](endpoint,payload));
    // The current bridge unwraps standard envelopes; tolerate older bridges too.
    if(result && result.status==='error') throw new Error(result.message || '操作失败');
    return result && result.status==='ok' ? result.data : result;
  }
  function time(value) {
    if(!value)return '尚无记录';
    const date=new Date(typeof value==='number' && value<1e12 ? value*1000 : value);
    return Number.isNaN(date.getTime()) ? '未知时间' : date.toLocaleString('zh-CN',{hour12:false});
  }
  function render() {
    const all=data.sessions;
    $('total').textContent=all.length;
    $('active').textContent=all.filter(x=>['running','waiting_approval','waiting_question'].includes(x.status)).length;
    $('kept').textContent=all.filter(x=>x.long_term===true).length;
    $('exempt').textContent=all.filter(x=>x.exempt===true).length;
    const query=$('search').value.trim().toLowerCase(), filter=$('status').value;
    const records=all.filter(x => (!query || [x.title,x.channel,x.id,x.session_id,x.origin].some(v=>String(v||'').toLowerCase().includes(query))) && (filter==='all' || (filter==='waiting' ? ['waiting_approval','waiting_question'].includes(x.status) : (x.status||'unknown')===filter)));
    const rows=$('rows'); rows.replaceChildren();
    for(const item of records) {
      const tr=node('tr'), identity=node('td');
      identity.append(node('div',item.title || item.channel || '未命名会话','title'),node('div',item.session_id || item.id,'secondary'));
      if(item.channel||item.origin)identity.append(node('div',[item.origin,item.channel].filter(Boolean).join(' · '),'secondary'));
      if(item.cwd)identity.append(node('div',item.cwd,'secondary'));
      const state=node('td'), status=Object.hasOwn(labels,item.status)?item.status:'unknown';
      state.append(node('span',labels[status],'badge '+status));
      if(!data.ingress_available)state.append(node('div','离线快照','secondary'));
      const used=node('td',time(item.last_used));
      if(typeof item.idle_remaining_sec==='number'&&!item.exempt){
        const sec=Math.max(0,item.idle_remaining_sec), mins=Math.floor(sec/60);
        used.append(node('div',sec<=0?'空闲已到期':`距回收约 ${mins>=60?Math.floor(mins/60)+' 小时 '+(mins%60)+' 分':mins+' 分钟'}`,'secondary'));
      } else if(item.exempt) used.append(node('div','免回收','secondary'));
      const controls=node('td');
      for(const [key,label] of [['long_term','长期保留'],['exempt','免回收']]) {
        const wrap=node('label',undefined,'toggle'), input=node('input'); input.type='checkbox'; input.checked=item[key]===true;
        input.disabled=pending.has(item.id); input.setAttribute('aria-label',`${item.title||item.id}：${label}`);
        input.addEventListener('change',()=>update(item,key,input.checked)); wrap.append(input,node('span',label)); controls.append(wrap,node('br'));
      }
      const exports=node('td'), actions=node('div',undefined,'export');
      const preview=node('button','查看对话');preview.addEventListener('click',()=>openReader(item));actions.append(preview);
      const runtime=node('button','运行详情');runtime.addEventListener('click',()=>openRuntime(item));actions.append(runtime);
      const rename=node('button','改名');rename.disabled=pending.has(item.id);rename.addEventListener('click',()=>renameSession(item));actions.append(rename);
      for(const [fmt,label] of [['markdown','Markdown'],['json','JSON']]) {const button=node('button',label);button.disabled=pending.has(item.id);button.addEventListener('click',()=>download(item,fmt));actions.append(button);}
      exports.append(actions); tr.append(identity,state,used,controls,exports); rows.append(tr);
    }
    if(!records.length) {const tr=node('tr'),td=node('td',all.length?'没有匹配的会话。':'暂无托管会话。使用 dsh_task 发起任务后，记录会在这里显示。','empty');td.colSpan=5;tr.append(td);rows.append(tr);}
  }
  async function refresh(manual=false) {
    if(!connected||busy||pending.size||disposed)return;
    busy=true;$('refresh').disabled=true;
    try {
      const result=await api('apiPost','sessions/refresh',{});
      if(!result||!Array.isArray(result.sessions))throw new Error('会话列表响应无效，请检查插件版本。');
      data=result;render();
      $('sync').replaceChildren(node('span',undefined,'dot'),document.createTextNode('更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})));
      $('sync').classList.toggle('offline',!data.ingress_available);
      notice(data.ingress_available?'':(data.message||'DSH 暂不可达，显示本地记录。'),!data.ingress_available);
      const idle=data.idle||{};$('policy').textContent=`空闲回收${idle.enabled?'已开启（'+idle.timeout_sec+' 秒）':'未开启'} · 每 5 秒同步，页面隐藏时暂停。导出可能包含对话内容，请妥善保存。`;
    } catch(error) {notice(error.message||'刷新失败；保留上次显示的数据。',true);$('sync').textContent='同步失败 · 保留上次快照';$('sync').classList.add('offline');}
    finally {busy=false;$('refresh').disabled=false;}
  }
  async function update(item,key,value) {
    if(busy||pending.has(item.id)){render();return;}
    pending.add(item.id);render();
    try {
      const result=await api('apiPost','sessions/update',{id:item.id,[key]:value});
      if(!result||result.id!==item.id||typeof result[key]!=='boolean')throw new Error('保存响应无效，请刷新确认。');
      Object.assign(item,result);notice('会话策略已保存。');
    } catch(error) {notice(error.message||'保存失败，已恢复之前的开关状态。',true);}
    finally {pending.delete(item.id);render();}
  }
  async function renameSession(item) {
    if(busy||pending.has(item.id))return;
    const next=window.prompt('会话名称（最多 120 字）',item.title||item.channel||'');
    if(next===null)return;
    const title=next.trim().slice(0,120);
    pending.add(item.id);render();
    try {
      const result=await api('apiPost','sessions/update',{id:item.id,title});
      if(!result||result.id!==item.id||typeof result.title!=='string')throw new Error('保存响应无效，请刷新确认。');
      Object.assign(item,result);notice('会话名称已更新。');
    } catch(error) {notice(error.message||'改名失败。',true);}
    finally {pending.delete(item.id);render();}
  }
  async function download(item,fmt) {
    if(pending.has(item.id))return;
    pending.add(item.id);render();
    try {
      const result=await api('apiGet','sessions/export',{id:item.id,format:fmt});
      if(!result||typeof result.content!=='string'||!result.content.length)throw new Error('没有可导出的记录，或导出响应为空。');
      const url=URL.createObjectURL(new Blob([result.content],{type:fmt==='json'?'application/json;charset=utf-8':'text/markdown;charset=utf-8'}));
      const a=node('a');a.href=url;a.download=(String(result.filename||('dsh-session.'+(fmt==='json'?'json':'md'))).split(/[\\/]/).pop()||'dsh-session').replace(/[\u0000-\u001f]/g,'');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notice('导出已生成。请妥善保管会话记录。');
    } catch(error) {notice(error.message||'导出失败，请重试。',true);}
    finally {pending.delete(item.id);render();}
  }
  let runtimeGeneration=0;
  async function openRuntime(item) {
    const generation=++runtimeGeneration;$('runtimePanel').hidden=false;$('runtimeEvidence').textContent='正在读取 '+(item.title||item.session_id)+'…';
    if($('runtimePanel').scrollIntoView)$('runtimePanel').scrollIntoView({behavior:'smooth',block:'start'});
    try {const value=await api('apiGet','sessions/runtime',{id:item.id});if(generation===runtimeGeneration)$('runtimeEvidence').textContent=JSON.stringify(value,null,2);}
    catch(error){if(generation===runtimeGeneration)$('runtimeEvidence').textContent='运行证据读取失败，请检查 companion 服务。';}
  }
  $('runtimeClose').addEventListener('click',()=>{runtimeGeneration++;$('runtimePanel').hidden=true;});
  let readerId=null, readerCursor='', readerLoading=false, readerGeneration=0, readerCount=0;
  async function openReader(item) {
    readerGeneration++;readerId=item.id;readerCursor='';readerCount=0;readerLoading=false;
    $('reader').hidden=false;$('readerTitle').textContent=item.title||item.channel||item.session_id;
    $('messages').replaceChildren();$('readerProgress').textContent='';
    if($('reader').scrollIntoView)$('reader').scrollIntoView({behavior:'smooth',block:'start'});
    await loadReader();
  }
  async function loadReader() {
    if(!readerId||readerLoading)return;
    const generation=readerGeneration;readerLoading=true;$('readerMore').disabled=true;
    $('readerNotice').textContent='正在读取对话…';
    try {
      const page=await api('apiGet','sessions/preview',{id:readerId,cursor:readerCursor});
      if(generation!==readerGeneration)return;
      if(!page||!Array.isArray(page.messages))throw new Error('预览响应无效');
      for(const message of page.messages) {
        const article=node('article');article.style.cssText='padding:16px;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--subtle)';
        const who=message.role==='user'?'用户':message.role==='assistant'?'助手':'消息';
        article.append(node('div',who+(message.continued?'（续）':'')+(message.timestamp?' · '+time(message.timestamp):''),'secondary'));
        const body=node('pre',String(message.content||''));body.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7;margin:10px 0 0';article.append(body);$('messages').append(article);readerCount++;
      }
      readerCursor=typeof page.next_cursor==='string'?page.next_cursor:'';
      $('readerNotice').textContent=(page.source==='local_fallback'?'⚠ 本地任务摘要，不是完整对话。 ':'')+(page.notice||'仅显示用户与助手文字正文，不含工具调用、思考过程和附件二进制。');
      $('readerProgress').textContent=`已加载 ${readerCount} 段 · `+(readerCursor?'还有更多，请继续加载':page.complete?'已读到对话末尾':'当前来源不完整');
      $('readerMore').hidden=!readerCursor;$('readerMore').textContent='加载更多';
      if(!readerCount)$('messages').append(node('p','此会话没有可预览的文字正文。'));
    } catch(error) {
      if(generation!==readerGeneration)return;
      $('readerNotice').textContent=error.message||'读取失败，请重试';$('readerMore').hidden=false;$('readerMore').textContent='重试读取';
    } finally {if(generation===readerGeneration){readerLoading=false;$('readerMore').disabled=false;}}
  }
  $('readerMore').addEventListener('click',loadReader);
  $('readerClose').addEventListener('click',()=>{readerGeneration++;readerId=null;readerLoading=false;$('reader').hidden=true;});
  $('search').addEventListener('input',render);$('status').addEventListener('change',render);
  $('refresh').addEventListener('click',()=>refresh(true));
  const timer=setInterval(()=>{if($('auto').checked&&!document.hidden)refresh();},5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('auto').checked)refresh();});
  window.addEventListener('pagehide',()=>{disposed=true;clearInterval(timer);});
  async function init() {
    sdk=window.AstrBotPluginView||window.AstrBotPluginPage;
    if(!sdk||window.parent===window){notice('请从 AstrBot 管理后台 → 拓展功能 → DSH 插件页面打开。本页面不提供公开访问或独立登录。',true);$('rows').replaceChildren();return;}
    try {await timeout(sdk.ready());connected=true;await refresh();}
    catch(error){notice('AstrBot 页面连接失败，请重新打开插件页面。',true);}
  }
  init();
})();
</script></body></html>
